<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>File Storage</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📁</text></svg>" />
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <h1 class="logo">FileVault</h1>
            <nav>
                <button class="btn btn-outline" id="configBtn">⚙️ Configure</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Upload zone -->
        <section class="upload-zone" id="uploadZone">
            <div class="upload-zone-content">
                <span class="upload-icon">⬆️</span>
                <p><strong>Drag & drop files here</strong> or <a href="#" id="uploadLink">browse</a></p>
                <input type="file" id="fileInput" multiple hidden />
                <p class="upload-hint">Files are stored in this GitHub repository under <code>assets/files/</code></p>
            </div>
        </section>

        <!-- Search & filter -->
        <section class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search files..." />
            </div>
            <div class="filter-group">
                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="document">📄 Documents</option>
                    <option value="image">🖼️ Images</option>
                    <option value="video">🎬 Videos</option>
                    <option value="audio">🎵 Audio</option>
                    <option value="archive">📦 Archives</option>
                    <option value="code">💻 Code</option>
                    <option value="other">❓ Other</option>
                </select>
                <select id="sortFilter">
                    <option value="name-asc">Name ↑</option>
                    <option value="name-desc">Name ↓</option>
                    <option value="size-asc">Size ↑</option>
                    <option value="size-desc">Size ↓</option>
                    <option value="date-asc">Oldest ↑</option>
                    <option value="date-desc">Newest ↓</option>
                </select>
            </div>
        </section>

        <!-- Stats bar -->
        <div class="stats-bar" id="statsBar">
            <span id="fileCount">0 files</span>
            <span id="totalSize">0 B</span>
        </div>

        <!-- File grid -->
        <section class="file-grid" id="fileGrid">
            <!-- Rendered by JS -->
        </section>

        <!-- Status / error messages -->
        <div id="statusMessage" class="status-message hidden"></div>
    </main>

    <!-- Config Modal -->
    <div class="modal-overlay hidden" id="configModal">
        <div class="modal">
            <h2>GitHub Configuration</h2>
            <p class="text-sm text-muted">
                To enable uploads and dynamic file listing, provide a
                <a href="https://github.com/settings/tokens" target="_blank">GitHub personal access token</a>
                with <code>repo</code> scope.
            </p>
            <form id="configForm">
                <label>Repository (owner/repo)</label>
                <input type="text" id="repoInput" placeholder="e.g. yourusername/yourrepo" />

                <label>GitHub Token</label>
                <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxx" />

                <label>Branch</label>
                <input type="text" id="branchInput" placeholder="main" value="main" />

                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" id="configCancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>FileVault &mdash; Powered by GitHub Pages</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
